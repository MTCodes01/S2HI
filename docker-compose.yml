version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: s2hi-backend
    ports:
      - "3001:8000"
    volumes:
      # Mount media directory for persistent file uploads
      - ./backend/media:/app/media
      # Use named volume for database persistence
      - s2hi-db:/app/db
    environment:
      - DJANGO_SETTINGS_MODULE=ld_screening.settings
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_PATH=/app/db/db.sqlite3
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - s2hi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: s2hi-frontend
    ports:
      - "3002:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - s2hi-network

volumes:
  s2hi-db:
    driver: local

networks:
  s2hi-network:
    driver: bridge
